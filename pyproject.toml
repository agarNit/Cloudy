[project]
name = "cloudy"
version = "0.1.3"
description = "Cloudy — a RAG-powered coding assistant CLI"
readme = "README.md"
authors = [
    {name = "Nitish Agarwal", email = "agarwalnitish121@gmail.com"}
]
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "langchain (>=1.3.14,<2.0.0)",
    "langchain-anthropic (>=1.4.8,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain-huggingface (>=1.2.2,<2.0.0)",
    "sentence-transformers (>=5.6.0,<6.0.0)",
    "tree-sitter (>=0.23,<1.0.0)",
    "langchain-qdrant (>=1.1.0,<2.0.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "mcp (>=1.28.1,<2.0.0)",
    "fastembed (>=0.8.0,<0.9.0)",
    "langfuse (>=4.14.2,<5.0.0)",
    "tree-sitter-language-pack (>=1.14.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "cloudy"}]


[tool.poetry.scripts]
cloudy = "cloudy.main:run"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

